name: torus

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  tis-scheduler:
    <<: *hardening
    image: "ghcr.io/${GHCR_OWNER}/tis@${TIS_DIGEST}"
    user: "10001:10001"
    command: ["python", "-m", "tis.scheduler"]
    env_file:
      - path: "${TIS_ENV_FILE:-/run/torus/torus-tis.env}"
        required: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - /opt/torus/state:/host-state:ro
    networks: [internal, egress]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-m", "tis.healthcheck", "scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tis-api:
    <<: *hardening
    image: "ghcr.io/${GHCR_OWNER}/tis@${TIS_DIGEST}"
    user: "10001:10001"
    command: ["uvicorn", "tis.api.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers"]
    env_file:
      - path: "${TIS_ENV_FILE:-/run/torus/torus-tis.env}"
        required: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    expose: ["8080"]
    networks: [internal, egress]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-m", "tis.healthcheck", "api"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    <<: *hardening
    image: "cloudflare/cloudflared@${CLOUDFLARED_DIGEST}"
    user: "65532:65532"
    command: ["--config", "/etc/cloudflared/torus-cloudflared.yml", "tunnel", "run"]
    env_file:
      - path: "${CLOUDFLARED_ENV_FILE:-/run/torus/torus-cloudflared.env}"
        required: true
    extra_hosts: ["host-gateway:host-gateway"]
    volumes:
      - ./cloudflared/torus-cloudflared.yml:/etc/cloudflared/torus-cloudflared.yml:ro
    networks: [internal, egress]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  torus-backup:
    <<: *hardening
    image: "ghcr.io/${GHCR_OWNER}/tis-backup@${BACKUP_DIGEST}"
    user: "10001:10001"
    env_file:
      - path: "${TIS_ENV_FILE:-/run/torus/torus-tis.env}"
        required: true
      - path: "${BACKUP_ENV_FILE:-/run/torus/torus-backup.env}"
        required: true
    tmpfs: ["/tmp:size=1g,mode=1777", "/work:size=1g,mode=1777"]
    networks: [egress]
    mem_limit: 512m
    cpus: 0.5
    profiles: ["backup"]

networks:
  internal:
    internal: true
  egress: {}
