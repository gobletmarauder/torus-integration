name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tis-image: ${{ steps.images.outputs.tis }}
      backup-image: ${{ steps.images.outputs.backup }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Resolve immutable image names
        id: images
        shell: bash
        run: |
          echo "tis=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tis:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "backup=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tis-backup:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Run G1 checks and build service image once
        run: make check IMAGE=${{ steps.images.outputs.tis }}
      - name: Build backup image once
        run: make backup-image-check BACKUP_IMAGE=${{ steps.images.outputs.backup }}
      - name: Scan service image before authentication or push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.tis }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Generate service CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.tis }}
          format: cyclonedx
          output: tis-release.cdx.json
          scanners: vuln
          skip-setup-trivy: true
      - name: Scan backup image before authentication or push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backup }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: true
      - name: Generate backup CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backup }}
          format: cyclonedx
          output: tis-backup-release.cdx.json
          scanners: vuln
          skip-setup-trivy: true
      - name: Save exact scanned images
        run: |
          docker save --output tis-release-image.tar "${{ steps.images.outputs.tis }}"
          docker save --output tis-backup-release-image.tar "${{ steps.images.outputs.backup }}"
      - name: Upload scanned images and SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torus-release-${{ github.run_id }}
          path: |
            tis-release-image.tar
            tis-backup-release-image.tar
            tis-release.cdx.json
            tis-backup-release.cdx.json
          if-no-files-found: error

  publish:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download exact scanned images and SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: torus-release-${{ github.run_id }}
      - name: Load exact scanned images
        run: |
          docker load --input tis-release-image.tar
          docker load --input tis-backup-release-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact scanned images
        run: |
          docker push "${{ needs.build-and-scan.outputs.tis-image }}"
          docker push "${{ needs.build-and-scan.outputs.backup-image }}"
      - name: Create immutable digest manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          tis_digest="$(docker buildx imagetools inspect "${{ needs.build-and-scan.outputs.tis-image }}" --format '{{.Manifest.Digest}}')"
          backup_digest="$(docker buildx imagetools inspect "${{ needs.build-and-scan.outputs.backup-image }}" --format '{{.Manifest.Digest}}')"
          [[ "$tis_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$backup_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'TIS_DIGEST=%s\nBACKUP_DIGEST=%s\nSOURCE_SHA=%s\n' \
            "$tis_digest" "$backup_digest" "$GITHUB_SHA" > torus-release-digests.env
          echo "tis=$tis_digest" >> "$GITHUB_OUTPUT"
          echo "backup=$backup_digest" >> "$GITHUB_OUTPUT"
      - name: Create release or verify identical rerun asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$GITHUB_REF_NAME" --pattern torus-release-digests.env --dir existing
            cmp --silent existing/torus-release-digests.env torus-release-digests.env
            gh release upload "$GITHUB_REF_NAME" torus-release-digests.env \
              tis-release.cdx.json tis-backup-release.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "Digest-pinned Torus service and backup images." \
              torus-release-digests.env tis-release.cdx.json tis-backup-release.cdx.json
          fi
      - name: Report published digests
        run: |
          echo "tis=${{ steps.manifest.outputs.tis }}"
          echo "tis-backup=${{ steps.manifest.outputs.backup }}"
