name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Resolve immutable image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tis:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Run G1 checks and build release image
        run: make check IMAGE=${{ steps.image.outputs.name }}
      - name: Scan before registry authentication or push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Generate CycloneDX SBOM for scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: cyclonedx
          output: tis-release.cdx.json
          scanners: vuln
          skip-setup-trivy: true
      - name: Save scanned image
        run: docker save --output tis-release-image.tar "${{ steps.image.outputs.name }}"
      - name: Upload scanned image and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tis-release-${{ github.run_id }}
          path: |
            tis-release-image.tar
            tis-release.cdx.json
          if-no-files-found: error

  publish:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned image and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tis-release-${{ github.run_id }}
      - name: Load exact scanned image
        run: docker load --input tis-release-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact scanned image
        run: docker push "${{ needs.build-and-scan.outputs.image }}"
      - name: Report published digest
        run: docker image inspect "${{ needs.build-and-scan.outputs.image }}" --format 'Published digest {{index .RepoDigests 0}}'

