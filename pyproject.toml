[project]
name = "torus-integration-service"
version = "0.0.0"
description = "Torus Integration Service"
requires-python = "==3.12.*"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "mypy==2.1.0",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/bundles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tis"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=src/tis",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/tis"]

[tool.coverage.report]
fail_under = 85
show_missing = true
